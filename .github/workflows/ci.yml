## The launcher's gates: fmt, clippy -D warnings, tests, all --locked.
## The privacy scan (tests/check-clean.ps1) does not run here: its value is the private pattern list
## supplied out of band, and with none it degrades to the runner's own username and proves nothing.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The version comes from rust-toolchain.toml only (with clippy and rustfmt).
      - name: Install the pinned toolchain
        shell: pwsh
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
