## Manual only (owner's call: no automatic builds). Builds claude-auto.exe from an existing version tag
## on a clean runner and publishes the GitHub release: the exe, its .sha256 and a build-provenance
## attestation (`gh attestation verify claude-auto.exe -R <repo>`). No build cache: built from the tag alone.
## Run: gh workflow run release.yml -f tag=v0.6.0
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to release, e.g. v0.6.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG does not match Cargo.toml version $v" }
      - name: Install the pinned toolchain
        shell: pwsh
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked
      - name: Hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\claude-auto.exe dist\
          $h = (Get-FileHash dist\claude-auto.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\claude-auto.exe.sha256", "$h  claude-auto.exe`n")
          $out = & dist\claude-auto.exe --launcher-version
          if ($out -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { throw "exe reports '$out', expected $env:TAG" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/claude-auto.exe
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG dist\claude-auto.exe dist\claude-auto.exe.sha256 --verify-tag --title "claude-auto $($env:TAG.TrimStart('v'))" --notes-from-tag
