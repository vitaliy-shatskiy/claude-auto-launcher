name: Bug report
description: Something the launcher does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. A screenshot of the console helps.
    validations: { required: true }
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of the commands below. Built from source? Add `git rev-parse --short HEAD` of your clone.
      value: |
        claude-auto --launcher-version
        claude --version
      render: shell
    validations: { required: true }
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Windows Terminal, conhost, Rider's terminal, VS Code, something else. Console behaviour differs enough between them to matter.
    validations: { required: true }
  - type: textarea
    id: checkpoint
    attributes:
      label: Test result
      description: "Built from source only: `cargo test --locked`, paste the result. Skip if you run the release exe or the bug stops it from running."
      render: shell
  - type: checkboxes
    id: features
    attributes:
      label: Features in play
      options:
        - label: "`sharing: true` (hardlinks and junctions between account roots)"
        - label: "`remote: true` (the crc companion)"
        - label: "`secretsRoot` configured"
        - label: "`plugins` configured"
        - label: "`selfUpdate: auto` (or a claude-auto self-update just ran)"
        - label: "Started through `--launcher-run`"
        - label: More than one launcher running at once
